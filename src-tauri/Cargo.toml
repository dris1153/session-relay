[package]
name = "session-relay"
version = "0.1.0"
description = "Sync Claude Code session data across machines via an encrypted private GitHub repo (unofficial)"
authors = ["session-relay contributors"]
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "session_relay_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
age = "0.12"
zstd = "0.14"
blake3 = "1.8"
hex = "0.4"
memchr = "2"
regex = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
log = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "native-tls", "charset", "http2", "system-proxy"] }
zxcvbn = "3"
keyring-core = "1"
windows-native-keyring-store = "1"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Crypto (scrypt, age, zstd) is unusably slow unoptimized; our own crate stays debuggable.
[profile.dev.package."*"]
opt-level = 2
